<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>光学实验室 - WebGL路径追踪</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; user-select: none; touch-action: none; overscroll-behavior: none; }
        #joystick-zone { position: absolute; bottom: 20px; left: 20px; width: 150px; height: 150px; display: none; z-index: 10; touch-action: none; }
        #loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 20px; z-index: 20; background: rgba(0,0,0,0.8); padding: 20px; border-radius: 10px;}
        .info { position: absolute; top: 15px; left: 15px; z-index: 10; pointer-events: none; text-shadow: 1px 1px 3px black; max-width: 380px; }
        .info h2 { margin: 0 0 10px 0; font-size: 22px; color: #4DA8DA; }
        .info p { margin: 5px 0; font-size: 14px; line-height: 1.4; color: #ddd; }
        .highlight { color: #FFD700; font-weight: bold; }
        canvas { display: block; }
        #hdr-toggle {
            position: static;
            display: flex !important;
            box-sizing: border-box;
            width: 100%;
            height: 24px !important;
            min-height: 24px !important;
            border: 1px solid rgba(255,255,255,0.28);
            border-radius: 6px;
            padding: 0 8px;
            margin: 0;
            color: #fff;
            background: rgba(20, 24, 32, 0.86);
            font: 600 12px 'Segoe UI', Tahoma, sans-serif;
            letter-spacing: 0.04em;
            line-height: 14px;
            text-align: center !important;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: border-color 120ms ease, background 120ms ease, color 120ms ease;
        }
        #hdr-row { padding: 4px; box-sizing: border-box; }
        #hdr-toggle:hover { border-color: rgba(255,255,255,0.65); background: rgba(42, 48, 62, 0.92); }
        #hdr-toggle.active { border-color: #ffd45c; color: #111; background: #ffd45c; }
        #hdr-toggle.pending { opacity: 0.65; cursor: wait; }
        #hdr-presentation {
            position: fixed;
            inset: 0;
            z-index: 2;
            width: 100%;
            height: 100%;
            visibility: hidden;
            pointer-events: auto;
        }
        .dg.ac { z-index: 15 !important; }
    </style>
    <!-- 引入 NippleJS 用于移动端摇杆 -->
    <script src="https://unpkg.com/nipplejs@0.10.0/dist/nipplejs.js"></script>
</head>
<body>
    <div id="loading">🚀 正在编译路径追踪着色器，请稍候...</div>
    <div id="joystick-zone"></div>
    <button id="hdr-toggle" type="button" aria-pressed="false" title="需要支持 WebGPU 的 HDR 显示器">HDR</button>
    <div class="info">
        <h2>🔬 几何光学路径追踪</h2>
        <p>操作说明：<br>
           - 电脑: <span class="highlight">WASD/QE</span> 移动, <span class="highlight">鼠标拖动</span> 旋转视角, <span class="highlight">滚轮</span> 缩放<br>
           - 手机: <span class="highlight">左下角摇杆</span> 移动, <span class="highlight">单指滑动</span> 旋转视角, <span class="highlight">双指</span> 缩放
        </p>
        <p>✨ 采样累积数: <span id="sample-count" class="highlight" style="font-size: 18px;">0</span></p>
    </div>

    <script type="module">
        import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.module.js';
        import { GUI } from 'https://unpkg.com/lil-gui@0.17.0/dist/lil-gui.esm.min.js';

        // === 场景数据配置 ===
        const MAX_LENSES = 5;
        const MAX_SCREENS = 3;
        const MAX_LIGHTS = 3;

        let lenses = [];
        let screens = [];
        let lights = [];
        let envLight = 0.10;

        // 默认场景：f=7.5的凸透镜，u=15, v=15 成等大倒立实像
        lights.push({ type: 0, pos: new THREE.Vector3(0, 0, -15), color: new THREE.Color(0xffffff) }); // F光源
        lenses.push({ type: 0, pos: new THREE.Vector3(0, 0, 0), r: 7.5, aperture: 4.0 }); // 凸透镜
        screens.push({ type: 0, pos: new THREE.Vector3(0, 0, 15), aperture: 0.3 }); // 光屏

        // === WebGL渲染器与相机初始化 ===
        // 直接创建 WebGL2 context，启用 desynchronized 提示，让渲染提交不依赖显示刷新节奏。
        const rendererCanvas = document.createElement('canvas');
        const rendererContext = rendererCanvas.getContext('webgl2', {
            antialias: false,
            powerPreference: 'high-performance',
            desynchronized: true
        });
        const renderer = rendererContext
            ? new THREE.WebGLRenderer({ canvas: rendererCanvas, context: rendererContext, antialias: false })
            : new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' });
        const displayPixelRatio = Math.min(window.devicePixelRatio || 1, 2);
        // 显示画布使用设备像素比，减少高分屏上的界面和最终合成锯齿。
        renderer.setPixelRatio(displayPixelRatio);
        renderer.setSize(window.innerWidth, window.innerHeight);
        // PT 和显示材质都会完整覆盖目标，不需要每次 render 额外清屏。
        renderer.autoClear = false;
        document.body.appendChild(renderer.domElement);

        // SDR 保持原来的 WebGL/PT 路径；只有用户点击 HDR 且环境确认可用时，
        // 才创建 WebGPU 的扩展动态范围显示画布。
        const hdrButton = document.getElementById('hdr-toggle');
        let hdrPresentation = null;
        let hdrTogglePromise = null;

        function markHdrUnavailable() {
            // 不弹窗、不改渲染后端；把原因放到 title，避免打断当前画面。
            hdrButton.title = '当前环境不支持 WebGPU HDR（需要 WebGPU 和 HDR 显示器）';
            hdrButton.dataset.status = 'unavailable';
        }

        function markHdrActive() {
            hdrButton.classList.add('active');
            hdrButton.setAttribute('aria-pressed', 'true');
            hdrButton.title = '关闭 HDR';
            hdrButton.dataset.status = 'active';
        }

        function markHdrInactive() {
            hdrButton.classList.remove('active');
            hdrButton.classList.remove('pending');
            hdrButton.setAttribute('aria-pressed', 'false');
            hdrButton.title = '需要支持 WebGPU 的 HDR 显示器';
            hdrButton.dataset.status = 'inactive';
        }

        function getHdrDisplayQuery() {
            try {
                return window.matchMedia('(dynamic-range: high)');
            } catch (error) {
                return { matches: false };
            }
        }

        function getHdrRenderSize() {
            return {
                width: Math.max(1, renderWidth),
                height: Math.max(1, renderHeight),
                displayWidth: Math.max(1, renderer.domElement.width),
                displayHeight: Math.max(1, renderer.domElement.height)
            };
        }

        function updateHdrResources(state) {
            const size = getHdrRenderSize();
            state.canvas.width = size.displayWidth;
            state.canvas.height = size.displayHeight;
            state.renderWidth = size.width;
            state.renderHeight = size.height;
            state.displayWidth = size.displayWidth;
            state.displayHeight = size.displayHeight;
            state.sourceIndex = 0;

            if (state.accumA) state.accumA.destroy();
            if (state.accumB) state.accumB.destroy();
            const textureOptions = {
                size: [size.width, size.height],
                format: 'rgba16float',
                usage: GPUTextureUsage.RENDER_ATTACHMENT | GPUTextureUsage.TEXTURE_BINDING
            };
            state.accumA = state.device.createTexture(textureOptions);
            state.accumB = state.device.createTexture(textureOptions);
            state.ptBindGroups = [
                state.device.createBindGroup({
                    layout: state.pathPipeline.getBindGroupLayout(0),
                    entries: [
                        { binding: 0, resource: state.accumA.createView() },
                        { binding: 1, resource: state.sampler },
                        { binding: 2, resource: { buffer: state.uniformBuffer } }
                    ]
                }),
                state.device.createBindGroup({
                    layout: state.pathPipeline.getBindGroupLayout(0),
                    entries: [
                        { binding: 0, resource: state.accumB.createView() },
                        { binding: 1, resource: state.sampler },
                        { binding: 2, resource: { buffer: state.uniformBuffer } }
                    ]
                })
            ];
            state.displayBindGroups = [
                state.device.createBindGroup({
                    layout: state.displayPipeline.getBindGroupLayout(0),
                    entries: [
                        { binding: 0, resource: state.accumA.createView() },
                        { binding: 1, resource: state.sampler },
                        { binding: 2, resource: { buffer: state.uniformBuffer } }
                    ]
                }),
                state.device.createBindGroup({
                    layout: state.displayPipeline.getBindGroupLayout(0),
                    entries: [
                        { binding: 0, resource: state.accumB.createView() },
                        { binding: 1, resource: state.sampler },
                        { binding: 2, resource: { buffer: state.uniformBuffer } }
                    ]
                })
            ];
        }

        function updateHdrUniforms(state) {
            const data = state.uniformData;
            data.fill(0);
            data.set(camera.matrixWorld.elements, 0);
            data.set(camera.projectionMatrixInverse.elements, 16);
            data[32] = state.renderWidth;
            data[33] = state.renderHeight;
            data[34] = state.sampleCount;
            data[35] = state.frame;
            data[36] = state.displayWidth;
            data[37] = state.displayHeight;
            data[40] = envLight;
            data[41] = lenses.length;
            data[42] = screens.length;
            data[43] = lights.length;

            let offset = 44;
            lenses.forEach(lens => {
                data[offset] = lens.pos.x;
                data[offset + 1] = lens.pos.y;
                data[offset + 2] = lens.pos.z;
                data[offset + 4] = lens.r;
                data[offset + 5] = lens.aperture;
                data[offset + 6] = lens.type === 0
                    ? Math.sqrt(Math.max(lens.r * lens.r - lens.aperture * lens.aperture, 0.001))
                    : lens.r + 0.2;
                data[offset + 7] = lens.type;
                offset += 8;
            });
            offset = 84;
            screens.forEach(screen => {
                data[offset] = screen.pos.x;
                data[offset + 1] = screen.pos.y;
                data[offset + 2] = screen.pos.z;
                data[offset + 4] = screen.type;
                data[offset + 5] = screen.aperture || 0.3;
                offset += 8;
            });
            offset = 108;
            lights.forEach(light => {
                data[offset] = light.pos.x;
                data[offset + 1] = light.pos.y;
                data[offset + 2] = light.pos.z;
                data[offset + 3] = light.type;
                data[offset + 4] = light.color.r;
                data[offset + 5] = light.color.g;
                data[offset + 6] = light.color.b;
                offset += 8;
            });
            state.device.queue.writeBuffer(state.uniformBuffer, 0, data);
        }

        async function createHdrPresentation() {
            // 这段检测只在点击 HDR 时执行，SDR 启动和运行完全不触碰 WebGPU。
            if (!navigator.gpu) return null;
            if (!getHdrDisplayQuery().matches) return null;

            const adapter = await navigator.gpu.requestAdapter({ powerPreference: 'high-performance' });
            if (!adapter) return null;
            const device = await adapter.requestDevice();
            const canvas = document.createElement('canvas');
            canvas.id = 'hdr-presentation';
            const context = canvas.getContext('webgpu');
            if (!context) return null;

            let applied;
            try {
                const size = getHdrRenderSize();
                canvas.width = size.displayWidth;
                canvas.height = size.displayHeight;
                context.configure({
                    device,
                    format: 'rgba16float',
                    usage: GPUTextureUsage.RENDER_ATTACHMENT,
                    alphaMode: 'premultiplied',
                    colorSpace: 'display-p3',
                    toneMapping: { mode: 'extended' },
                    presentMode: 'immediate'
                });
                applied = typeof context.getConfiguration === 'function'
                    ? context.getConfiguration()
                    : null;
            } catch (error) {
                return null;
            }

            const active = Boolean(
                applied &&
                applied.format === 'rgba16float' &&
                applied.toneMapping &&
                applied.toneMapping.mode === 'extended'
            );
            if (!active) return null;

            try {
                const pathShader = device.createShaderModule({ code: `
                    struct Lens { pos: vec4<f32>, params: vec4<f32> };
                    struct Screen { pos: vec4<f32>, params: vec4<f32> };
                    struct Light { pos: vec4<f32>, color: vec4<f32> };
                    struct Uniforms {
                        cameraWorld: mat4x4<f32>, cameraProjectionInverse: mat4x4<f32>,
                        render: vec4<f32>, display: vec4<f32>, scene: vec4<f32>,
                        lenses: array<Lens, 5>, screens: array<Screen, 3>, lights: array<Light, 3>,
                    };
                    struct VertexOutput { @builtin(position) position: vec4<f32>, @location(0) uv: vec2<f32> };
                    struct DistanceHit { d: f32, id: i32 };
                    struct Material { kind: i32, color: vec3<f32>, emissive: vec3<f32> };
                    @group(0) @binding(0) var previousTexture: texture_2d<f32>;
                    @group(0) @binding(1) var previousSampler: sampler;
                    @group(0) @binding(2) var<uniform> u: Uniforms;
                    var<private> seed: u32;

                    @vertex
                    fn vertexMain(@builtin(vertex_index) vertexIndex: u32) -> VertexOutput {
                        var positions = array<vec2<f32>, 3>(vec2<f32>(-1.0,-1.0), vec2<f32>(3.0,-1.0), vec2<f32>(-1.0,3.0));
                        var uvs = array<vec2<f32>, 3>(vec2<f32>(0.0,1.0), vec2<f32>(2.0,1.0), vec2<f32>(0.0,-1.0));
                        var output: VertexOutput;
                        output.position = vec4<f32>(positions[vertexIndex],0.0,1.0);
                        output.uv = uvs[vertexIndex];
                        return output;
                    }
                    fn pcgHash() -> u32 {
                        seed = seed * 747796405u + 2891336453u;
                        let word = ((seed >> ((seed >> 28u) + 4u)) ^ seed) * 277803737u;
                        return (word >> 22u) ^ word;
                    }
                    fn random() -> f32 { return f32(pcgHash()) / 4294967296.0; }
                    fn cosineWeightedHemisphere(n: vec3<f32>) -> vec3<f32> {
                        let r1 = random();
                        let r2 = random();
                        let radius = sqrt(r1);
                        let theta = 6.28318530 * r2;
                        var reference = vec3<f32>(0.0,1.0,0.0);
                        if (abs(n.y) > 0.5) { reference = vec3<f32>(1.0,0.0,0.0); }
                        let tangent = normalize(cross(n, reference));
                        let bitangent = cross(n, tangent);
                        return normalize(tangent * radius * cos(theta) + bitangent * radius * sin(theta) + n * sqrt(max(0.0,1.0-r1)));
                    }
                    fn sdBox(p: vec3<f32>, b: vec3<f32>) -> f32 {
                        let q = abs(p) - b;
                        return length(max(q,vec3<f32>(0.0))) + min(max(q.x,max(q.y,q.z)),0.0);
                    }
                    fn sdSphere(p: vec3<f32>, radius: f32) -> f32 { return length(p)-radius; }
                    fn sdCylinderZ(p: vec3<f32>, h: f32, radius: f32) -> f32 {
                        let d = abs(vec2<f32>(length(p.xy),p.z))-vec2<f32>(radius,h);
                        return min(max(d.x,d.y),0.0)+length(max(d,vec2<f32>(0.0)));
                    }
                    fn opU(a: DistanceHit, b: DistanceHit) -> DistanceHit {
                        if (a.d < b.d) { return a; }
                        return b;
                    }
                    fn getStand(lp: vec3<f32>, bottomY: f32) -> f32 {
                        let poleH = max(0.0,bottomY+5.8)*0.5;
                        let dPole = sdBox(lp-vec3<f32>(0.0,bottomY-poleH,0.0),vec3<f32>(0.3,poleH,0.3));
                        let dBase = sdBox(lp-vec3<f32>(0.0,-5.8,0.0),vec3<f32>(1.5,0.2,1.0));
                        return min(dPole,dBase);
                    }
                    fn mapDistance(p: vec3<f32>) -> DistanceHit {
                        var result = DistanceHit(1e20,-1);
                        result = opU(result,DistanceHit(sdBox(p-vec3<f32>(0.0,-6.5,0.0),vec3<f32>(4.0,0.5,30.0)),0));
                        var stands = 1e20;
                        for (var i=0u; i<3u; i=i+1u) {
                            if (f32(i) >= u.scene.w) { break; }
                            let light = u.lights[i];
                            let lp = p-light.pos.xyz;
                            if (i32(light.pos.w)==0) {
                                let bound = sdBox(lp,vec3<f32>(1.2,2.1,0.1));
                                var dF = bound;
                                if (bound <= 0.5) {
                                    let dF1=sdBox(lp-vec3<f32>(-1.0,0.0,0.0),vec3<f32>(0.2,2.0,0.1));
                                    let dF2=sdBox(lp-vec3<f32>(0.3,1.8,0.0),vec3<f32>(1.1,0.2,0.1));
                                    let dF3=sdBox(lp-vec3<f32>(0.1,0.2,0.0),vec3<f32>(0.9,0.2,0.1));
                                    dF=min(dF1,min(dF2,dF3));
                                }
                                result=opU(result,DistanceHit(dF,10+i32(i)));
                                stands=min(stands,getStand(lp,-2.0));
                            } else {
                                result=opU(result,DistanceHit(sdSphere(lp,1.5),10+i32(i)));
                                stands=min(stands,getStand(lp,-1.5));
                            }
                        }
                        for (var i=0u; i<5u; i=i+1u) {
                            if (f32(i) >= u.scene.y) { break; }
                            let lens=u.lenses[i];
                            let lp=p-lens.pos.xyz;
                            let radius=lens.params.x;
                            let aperture=lens.params.y;
                            let dCylinder=sdCylinderZ(lp,5.0,aperture);
                            var dLens=1e20;
                            let d1=sdSphere(lp-vec3<f32>(0.0,0.0,lens.params.z),radius);
                            let d2=sdSphere(lp-vec3<f32>(0.0,0.0,-lens.params.z),radius);
                            if (i32(lens.params.w)==0) {
                                if (dCylinder>0.5) { dLens=dCylinder; } else { dLens=max(max(d1,d2),dCylinder); }
                            } else {
                                if (dCylinder>0.5) { dLens=dCylinder; } else { dLens=max(dCylinder,max(-d1,-d2)); }
                            }
                            result=opU(result,DistanceHit(dLens,20+i32(i)));
                            stands=min(stands,getStand(lp,-aperture));
                        }
                        for (var i=0u; i<3u; i=i+1u) {
                            if (f32(i) >= u.scene.z) { break; }
                            let screen=u.screens[i];
                            let sp=p-screen.pos.xyz;
                            if (i32(screen.params.x)==0) {
                                result=opU(result,DistanceHit(sdBox(sp,vec3<f32>(4.5,4.5,0.05)),30+i32(i)));
                            } else {
                                let board=sdBox(sp,vec3<f32>(4.5,4.5,0.005));
                                let hole=sdCylinderZ(sp,0.2,screen.params.y);
                                result=opU(result,DistanceHit(max(board,-hole),30+i32(i)));
                            }
                            stands=min(stands,getStand(sp,-4.5));
                        }
                        return opU(result,DistanceHit(stands,1));
                    }
                    fn getMaterial(p: vec3<f32>, id: i32) -> Material {
                        if (id==0) {
                            var bench=vec3<f32>(0.15);
                            if (fract(p.z)<0.05 && abs(p.x)<3.0) { bench=vec3<f32>(0.4); }
                            if (fract(p.z/5.0)<0.02 && abs(p.x)<3.0) { bench=vec3<f32>(0.7); }
                            return Material(1,bench,vec3<f32>(0.0));
                        }
                        if (id>=10 && id<13) { return Material(3,vec3<f32>(0.0),u.lights[u32(id-10)].color.xyz*300.0); }
                        if (id>=20 && id<25) { return Material(2,vec3<f32>(0.98,0.99,1.0),vec3<f32>(0.0)); }
                        if (id>=30 && id<33) {
                            let index=u32(id-30);
                            if (i32(u.screens[index].params.x)==0) { return Material(4,vec3<f32>(0.95),vec3<f32>(0.0)); }
                            return Material(1,vec3<f32>(0.2),vec3<f32>(0.0));
                        }
                        return Material(1,vec3<f32>(0.25),vec3<f32>(0.0));
                    }
                    fn calcNormal(p: vec3<f32>) -> vec3<f32> {
                        let e=0.5773*0.002;
                        return normalize(
                            vec3<f32>( e,-e,-e)*mapDistance(p+vec3<f32>( e,-e,-e)).d+
                            vec3<f32>(-e,-e, e)*mapDistance(p+vec3<f32>(-e,-e, e)).d+
                            vec3<f32>(-e, e,-e)*mapDistance(p+vec3<f32>(-e, e,-e)).d+
                            vec3<f32>( e, e, e)*mapDistance(p+vec3<f32>( e, e, e)).d
                        );
                    }
                    @fragment
                    fn fragmentMain(input: VertexOutput) -> @location(0) vec4<f32> {
                        seed=u32(input.position.x*1973.0+input.position.y*9277.0+u.render.w*26699.0);
                        let jitter=vec2<f32>(random()-0.5,random()-0.5)/u.render.xy;
                        let ndc=vec2<f32>(input.uv.x*2.0-1.0+jitter.x*2.0,1.0-input.uv.y*2.0+jitter.y*2.0);
                        let projected=u.cameraProjectionInverse*vec4<f32>(ndc,1.0,1.0);
                        let rdCamera=normalize(projected.xyz/projected.w);
                        let rdWorld=(u.cameraWorld*vec4<f32>(rdCamera,0.0)).xyz;
                        let origin=(u.cameraWorld*vec4<f32>(0.0,0.0,0.0,1.0)).xyz;
                        var rd=rdWorld;
                        var ro=origin;
                        var color=vec3<f32>(0.0);
                        var throughput=vec3<f32>(1.0);
                        for (var bounce=0; bounce<5; bounce=bounce+1) {
                            if (bounce>2) {
                                let alive=max(throughput.r,max(throughput.g,throughput.b));
                                if (random()>alive) { break; }
                                throughput=throughput/alive;
                            }
                            var hit=DistanceHit(1e20,-1);
                            var travel=0.0;
                            for (var step=0; step<150; step=step+1) {
                                if (travel>150.0) { break; }
                                let point=ro+rd*travel;
                                let candidate=mapDistance(point);
                                if (abs(candidate.d)<0.001) { hit=candidate; break; }
                                travel=travel+abs(candidate.d)*0.99;
                            }
                            if (travel>150.0) { color=color+throughput*vec3<f32>(u.scene.x); break; }
                            let point=ro+rd*travel;
                            let material=getMaterial(point,hit.id);
                            if (material.kind==3) { color=color+throughput*material.emissive; break; }
                            let normal=calcNormal(point);
                            if (material.kind==1 || material.kind==4) {
                                rd=cosineWeightedHemisphere(normal);
                                ro=point+normal*0.005;
                                throughput=throughput*material.color;
                            } else {
                                let ior=1.5;
                                let entering=dot(rd,normal)<0.0;
                                let eta=select(ior,1.0/ior,entering);

                                let reflectProb=reflectance+(1.0-reflectance)*pow(1.0-cosTheta,5.0);
                                if (cannotRefract || random()<reflectProb) { rd=reflect(rd,orientedNormal); } else { rd=refract(rd,orientedNormal,eta); }
                                ro=point+rd*0.005;
                                throughput=throughput*material.color;
                            }

                        if (u.render.z <= 1.0) { return vec4<f32>(color,1.0); }
                        let previous=textureSample(previousTexture,previousSampler,input.uv).rgb;

                    struct Light { pos: vec4<f32>, color: vec4<f32> };
                    struct Uniforms {

                        render: vec4<f32>, display: vec4<f32>, scene: vec4<f32>,

                    struct VertexOutput { @builtin(position) position: vec4<f32>, @location(0) uv: vec2<f32> };

                            a*log(max(12.0*col-b,vec3<f32>(1e-6)))+c,

                                             pow(max((softSignal+0.055)/1.055,vec3<f32>(0.0)),vec3<f32>(2.4)),

                            vec3<f32>(0.82259273,0.03319955,0.01708535),

                            vec3<f32>(0.00000000,0.00000000,0.91030148)

                    layout:'auto',
                    vertex:{module:displayShader,entryPoint:'vertexMain'},

                    device,canvas,context,pathPipeline,displayPipeline,

        function resizeHdrPresentation() {
            if (!hdrPresentation) return;

                updateHdrResources(hdrPresentation);
                hdrPresentation.needsReset = true;
            } catch (error) {
                disableHdrPresentation();
            }
        }

        function disableHdrPresentation() {
            const state = hdrPresentation;
            hdrPresentation = null;
            if (state) {
                if (state.accumA) state.accumA.destroy();
                if (state.accumB) state.accumB.destroy();
                if (state.uniformBuffer) state.uniformBuffer.destroy();
                state.canvas.remove();
            }
            renderer.domElement.style.visibility = 'visible';
            markHdrInactive();
            resetAccumulation();
        }

        function renderHdrPass(deltaSeconds) {
            if (!hdrPresentation) return;
            const state = hdrPresentation;
            try {
                const resetThisBatch = state.needsReset || needsReset;
                if (resetThisBatch) {
                    state.sampleCount = 1;
                    state.needsReset = false;
                    needsReset = false;
                }
                updateCameraTransform(deltaSeconds);
                let sourceIndex = resetThisBatch ? 0 : state.sourceIndex;
                if (resetThisBatch) state.sourceIndex = 0;
                for (let passIndex = 0; passIndex < passesPerBatch; passIndex++) {
                    if (!(resetThisBatch && passIndex === 0)) state.sampleCount += 1;
                    state.frame += 1;
                    updateHdrUniforms(state);
                    const commandEncoder = state.device.createCommandEncoder();
                    const pass = commandEncoder.beginRenderPass({
                        colorAttachments: [{
                            view: (sourceIndex === 0 ? state.accumB : state.accumA).createView(),
                            clearValue: { r: 0, g: 0, b: 0, a: 1 },
                            loadOp: 'clear',
                            storeOp: 'store'
                        }]
                    });
                    pass.setPipeline(state.pathPipeline);
                    pass.setBindGroup(0, state.ptBindGroups[sourceIndex]);
                    pass.draw(3);
                    pass.end();
                    state.device.queue.submit([commandEncoder.finish()]);
                    sourceIndex = 1 - sourceIndex;
                }
                state.sourceIndex = sourceIndex;
                const displayEncoder = state.device.createCommandEncoder();
                const displayPass = displayEncoder.beginRenderPass({
                    colorAttachments: [{
                        view: state.context.getCurrentTexture().createView(),
                        clearValue: { r: 0, g: 0, b: 0, a: 1 },
                        loadOp: 'clear',
                        storeOp: 'store'
                    }]
                });
                displayPass.setPipeline(state.displayPipeline);
                displayPass.setBindGroup(0, state.displayBindGroups[sourceIndex]);
                displayPass.draw(3);
                displayPass.end();
                state.device.queue.submit([displayEncoder.finish()]);
                const now = performance.now();
                if (now - lastUiUpdate >= 100) {
                    sampleCountSpan.innerText = Math.floor(state.sampleCount);
                    lastUiUpdate = now;
                }
                if (loadingDiv.style.display !== 'none') loadingDiv.style.display = 'none';
            } catch (error) {
                // 运行中设备失效时静默回到已经存在的 SDR WebGL 画布。
                disableHdrPresentation();
            }
        }

        async function toggleHdr() {

                .then(state => {
                    if (!state) {

                        return;
                    }
                    document.body.appendChild(state.canvas);
                    hdrPresentation = state;
                    renderer.domElement.style.visibility = 'hidden';
                    state.canvas.style.visibility = 'visible';

        hdrButton.addEventListener('click', toggleHdr);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);

        camera.lookAt(0, 0, 10);

        let cameraYaw = initialEuler.y;

        // === 累积缓冲 (Ping-Pong FBO) ===

        let renderWidth = Math.max(1, window.innerWidth);

        // === 核心路径追踪着色器 ===
        const ptFragmentShader = `
            precision highp float;
            precision highp int;
            
            uniform sampler2D tPrevious;
            uniform float u_sampleCount;
            uniform vec2 u_resolution;
            uniform mat4 u_cameraWorldMatrix;
            uniform mat4 u_cameraProjectionMatrixInverse;
            uniform float u_frame;
            uniform float u_envLight;

            #define MAX_LENSES ${MAX_LENSES}
            #define MAX_SCREENS ${MAX_SCREENS}
            #define MAX_LIGHTS ${MAX_LIGHTS}

            uniform int u_numLenses;
            uniform int u_lensTypes[MAX_LENSES];
            uniform vec3 u_lensPos[MAX_LENSES];
            uniform float u_lensR[MAX_LENSES];
            uniform float u_lensAperture[MAX_LENSES];
            uniform float u_lensOffset[MAX_LENSES];

            uniform int u_numScreens;
            uniform int u_screenTypes[MAX_SCREENS];
            uniform vec3 u_screenPos[MAX_SCREENS];
            uniform float u_screenAperture[MAX_SCREENS];

            uniform int u_numLights;
            uniform int u_lightTypes[MAX_LIGHTS];
            uniform vec3 u_lightPos[MAX_LIGHTS];
            uniform vec3 u_lightColor[MAX_LIGHTS];

            varying vec2 vUv;

            #define MAT_DIFFUSE 1
            #define MAT_GLASS 2
            #define MAT_EMISSIVE 3
            #define MAT_SCREEN 4

            struct Material {
                int type;
                vec3 color;
                vec3 emissive;
            };

            struct DistanceHit {
                float d;
                int id;
            };

            #define ID_STAND 1
            #define ID_LIGHT_BASE 10
            #define ID_LENS_BASE 20
            #define ID_SCREEN_BASE 30

            // 随机数生成器 (PCG)
            uint seed;
            uint pcg_hash(inout uint state) {
                state = state * 747796405u + 2891336453u;
                uint word = ((state >> ((state >> 28u) + 4u)) ^ state) * 277803737u;
                return (word >> 22u) ^ word;
            }
            float random() {
                return float(pcg_hash(seed)) / 4294967296.0;
            }

            // 余弦加权半球采样 (漫反射)
            vec3 cosineWeightedHemisphere(vec3 n) {
                float r1 = random();
                float r2 = random();
                float r = sqrt(r1);
                float theta = 2.0 * 3.14159265 * r2;
                vec3 t = normalize(cross(n, abs(n.y) > 0.5 ? vec3(1,0,0) : vec3(0,1,0)));
                vec3 b = cross(n, t);
                return normalize(t * r * cos(theta) + b * r * sin(theta) + n * sqrt(max(0.0, 1.0 - r1)));
            }

            // SDF 形状
            float sdBox(vec3 p, vec3 b) {
                vec3 q = abs(p) - b;
                return length(max(q,0.0)) + min(max(q.x,max(q.y,q.z)),0.0);
            }
            float sdSphere(vec3 p, float s) {
                return length(p) - s;
            }
            float sdCylinderZ(vec3 p, float h, float r) {
                vec2 d = abs(vec2(length(p.xy), p.z)) - vec2(r, h);
                return min(max(d.x, d.y), 0.0) + length(max(d, 0.0));
            }

            DistanceHit opU(DistanceHit d1, DistanceHit d2) {
                if (d1.d < d2.d) {
                    return d1;
                } else {

                }
            }

            // 统一生成滑块和支架的函数
            float getStand(vec3 lp, float bottomY) {
                float poleH = max(0.0, bottomY + 5.8) * 0.5;
                float dPole = sdBox(lp - vec3(0.0, bottomY - poleH, 0.0), vec3(0.3, poleH, 0.3));
                float dBase = sdBox(lp - vec3(0.0, -5.8, 0.0), vec3(1.5, 0.2, 1.0));

            DistanceHit mapDistance(vec3 p) {
                DistanceHit res = DistanceHit(1e20, -1);

                // 桌面下移至 Y = -6.5 避免遮挡成像
                float dBench = sdBox(p - vec3(0.0, -6.5, 0.0), vec3(4.0, 0.5, 30.0));
                res = opU(res, DistanceHit(dBench, 0));

                float dStands = 1e20;

                for(int i=0; i<MAX_LIGHTS; i++) {
                    if(i >= u_numLights) break;
                    vec3 lp = p - u_lightPos[i];
                    if (u_lightTypes[i] == 0) {

                        if (dFBound <= 0.5) {
                            float dF1 = sdBox(lp - vec3(-1.0, 0.0, 0.0), vec3(0.2, 2.0, 0.1));
                            float dF2 = sdBox(lp - vec3(0.3, 1.8, 0.0), vec3(1.1, 0.2, 0.1));
                            float dF3 = sdBox(lp - vec3(0.1, 0.2, 0.0), vec3(0.9, 0.2, 0.1));
                            dF = min(dF1, min(dF2, dF3));

                        // 修复：大幅提亮光源，以满足小孔成像苛刻的追踪概率需求
                        res = opU(res, DistanceHit(dF, ID_LIGHT_BASE + i));
                        dStands = min(dStands, getStand(lp, -2.0)); 
                    } else if (u_lightTypes[i] == 1) { 
                        float dB = sdSphere(lp, 1.5);
                        res = opU(res, DistanceHit(dB, ID_LIGHT_BASE + i));
                        dStands = min(dStands, getStand(lp, -1.5));
                    }
                }

                for(int i=0; i<MAX_LENSES; i++) {
                    if(i >= u_numLenses) break;
                    vec3 lp = p - u_lensPos[i];
                    float R = u_lensR[i];
                    float r = u_lensAperture[i];
                    float dLens = 1e20;
                    if (u_lensTypes[i] == 0) {
                        float offset = u_lensOffset[i];
                        float dCyl = sdCylinderZ(lp, 5.0, r);
                        if (dCyl > 0.5) {
                            dLens = dCyl;
                        } else {
                            float d1 = sdSphere(lp - vec3(0,0, offset), R);
                            float d2 = sdSphere(lp - vec3(0,0, -offset), R);
                            dLens = max(max(d1, d2), dCyl);
                        }
                    } else if (u_lensTypes[i] == 1) {
                        // 修复凹透镜致命Bug：之前0.5厚度会让边缘被一刀切成平面玻璃，彻底失去发散作用
                        float dCyl = sdCylinderZ(lp, 5.0, r);
                        float offset = u_lensOffset[i];
                        if (dCyl > 0.5) {
                            dLens = dCyl;
                        } else {
                            float d1 = sdSphere(lp - vec3(0,0, offset), R);
                            float d2 = sdSphere(lp - vec3(0,0, -offset), R);
                            dLens = max(dCyl, max(-d1, -d2));

                    if (u_screenTypes[i] == 0) {

            }

            Material getMaterial(vec3 p, int id) {
                if (id == 0) {
                    vec3 benchCol = vec3(0.15);
                    if (mod(p.z, 1.0) < 0.05 && abs(p.x) < 3.0) benchCol = vec3(0.4);
                    if (mod(p.z, 5.0) < 0.1 && abs(p.x) < 3.0) benchCol = vec3(0.7);

                    if (u_screenTypes[i] == 0) {

                    }
                    return Material(MAT_DIFFUSE, vec3(0.2), vec3(0));
                }

            vec3 calcNormal(vec3 p) {

                vec2 e = vec2(1.0, -1.0) * 0.5773 * 0.002;

                    e.xyy * mapDistance(p + e.xyy).d +
                    e.yyx * mapDistance(p + e.yyx).d +
                    e.yxy * mapDistance(p + e.yxy).d +

            }

            void main() {
                seed = uint(gl_FragCoord.x * 1973.0 + gl_FragCoord.y * 9277.0 + u_frame * 26699.0);
                
                vec2 jitter = vec2(random() - 0.5, random() - 0.5) / u_resolution;

                vec3 rd = (u_cameraWorldMatrix * vec4(normalize(target.xyz / target.w), 0.0)).xyz;
                vec3 ro = (u_cameraWorldMatrix * vec4(0.0, 0.0, 0.0, 1.0)).xyz;

                vec3 color = vec3(0.0);
                vec3 throughput = vec3(1.0);
                
                for (int bounce = 0; bounce < 5; bounce++) {
                    if (bounce > 2) {
                        float pAlive = max(throughput.r, max(throughput.g, throughput.b));
                        if (random() > pAlive) break;

                    }

                    DistanceHit hit = DistanceHit(1e20, -1);
                    float t = 0.0;
                    
                    // 加大最大步进次数防止穿孔时光线漏算

                        break;
                    }

                    vec3 n = calcNormal(p);

                    if (mat.type == MAT_DIFFUSE) {
                        rd = cosineWeightedHemisphere(n);
                        ro = p + n * 0.005;
                        throughput *= mat.color;
                        
                    } else if (mat.type == MAT_SCREEN) {
                        // 光屏只向法线半球散射，避免一半样本射进屏幕后方。
                        rd = cosineWeightedHemisphere(n);
                        ro = p + n * 0.005;
                        throughput *= mat.color;
                        
                    } else if (mat.type == MAT_GLASS) {
                        float ior = 1.5;
                        bool entering = dot(rd, n) < 0.0;
                        float eta = entering ? 1.0 / ior : ior;
                        vec3 normal = entering ? n : -n;

                        float cosTheta = min(dot(-rd, normal), 1.0);
                        float sinTheta = sqrt(1.0 - cosTheta * cosTheta);
                        bool cannotRefract = eta * sinTheta > 1.0; 

                        float r0 = (1.0 - eta) / (1.0 + eta);
                        r0 = r0 * r0;
                        float refProb = r0 + (1.0 - r0) * pow(1.0 - cosTheta, 5.0);

                        if (cannotRefract || random() < refProb) {
                            rd = reflect(rd, normal);
                        } else {
                            rd = refract(rd, normal, eta);
                        }
                        ro = p + rd * 0.005;
                        throughput *= mat.color;
                    }
                }

                vec3 prevColor = texture2D(tPrevious, vUv).rgb;
                vec3 finalColor = mix(prevColor, color, 1.0 / u_sampleCount);
                gl_FragColor = vec4(finalColor, 1.0);
            }
        `;

        const displayFragmentShader = `
            precision highp float;
            varying vec2 vUv;
            uniform sampler2D tTexture;
            uniform float u_exposure;
            uniform vec2 u_textureResolution;

            // 累积纹理保持 NearestFilter；只在最终显示阶段手动双线性采样。
            vec3 sampleAccumulation(vec2 uv) {
                vec2 texel = 1.0 / u_textureResolution;
                vec2 coord = uv * u_textureResolution - 0.5;
                vec2 base = floor(coord);
                vec2 f = fract(coord);
                vec2 uv00 = (base + vec2(0.5, 0.5)) * texel;
                vec2 uv10 = uv00 + vec2(texel.x, 0.0);
                vec2 uv01 = uv00 + vec2(0.0, texel.y);
                vec2 uv11 = uv00 + texel;
                vec3 row0 = mix(texture2D(tTexture, uv00).rgb, texture2D(tTexture, uv10).rgb, f.x);
                vec3 row1 = mix(texture2D(tTexture, uv01).rgb, texture2D(tTexture, uv11).rgb, f.x);
                return mix(row0, row1, f.y);
            }

            // Hable filmic 曲线：压低高光硬截断，保留颜色层次。
            vec3 filmic(vec3 x) {
                const float A = 0.15;
                const float B = 0.50;
                const float C = 0.10;
                const float D = 0.20;
                const float E = 0.02;
                const float F = 0.30;
                return ((x * (A * x + C * B) + D * E) /
                        (x * (A * x + B) + D * F)) - E / F;
            }
            void main() {
                vec3 color = max(sampleAccumulation(vUv), 0.0);
                // 提高白点，避免光源和屏幕高亮过早被压成纯白。
                vec3 whiteScale = 1.0 / filmic(vec3(32.0));
                color = clamp(filmic(color * u_exposure) * whiteScale, 0.0, 1.0);
                color = pow(color, vec3(1.0 / 2.2));
                gl_FragColor = vec4(color, 1.0);
            }
        `;

        const vertexShader = `
            varying vec2 vUv;
            void main() {
                vUv = uv;
                gl_Position = vec4(position, 1.0);
            }
        `;

        const ptMaterial = new THREE.ShaderMaterial({
            uniforms: {
                tPrevious: { value: null },
                u_sampleCount: { value: 1.0 },
                u_resolution: { value: new THREE.Vector2(renderWidth, renderHeight) },
                u_cameraWorldMatrix: { value: camera.matrixWorld },
                u_cameraProjectionMatrixInverse: { value: camera.projectionMatrixInverse },
                u_frame: { value: 0 },
                u_envLight: { value: envLight },
                u_numLenses: { value: 0 },
                u_lensTypes: { value: new Int32Array(MAX_LENSES).fill(0) },
                u_lensPos: { value: Array(MAX_LENSES).fill().map(()=>new THREE.Vector3()) },
                u_lensR: { value: new Float32Array(MAX_LENSES).fill(0) },
                u_lensAperture: { value: new Float32Array(MAX_LENSES).fill(0) },
                u_lensOffset: { value: new Float32Array(MAX_LENSES).fill(0) },
                u_numScreens: { value: 0 },
                u_screenTypes: { value: new Int32Array(MAX_SCREENS).fill(0) },
                u_screenPos: { value: Array(MAX_SCREENS).fill().map(()=>new THREE.Vector3()) },
                u_screenAperture: { value: new Float32Array(MAX_SCREENS).fill(0.3) },
                u_numLights: { value: 0 },
                u_lightTypes: { value: new Int32Array(MAX_LIGHTS).fill(0) },
                u_lightPos: { value: Array(MAX_LIGHTS).fill().map(()=>new THREE.Vector3()) },
                u_lightColor: { value: Array(MAX_LIGHTS).fill().map(()=>new THREE.Vector3()) }
            },
            vertexShader,
            fragmentShader: ptFragmentShader,
            depthWrite: false, depthTest: false
        });

        const displayMaterial = new THREE.ShaderMaterial({
            uniforms: {
                tTexture: { value: null },
                u_exposure: { value: 0.8 },
                u_textureResolution: { value: new THREE.Vector2(renderWidth, renderHeight) }
            },
            vertexShader,
            fragmentShader: displayFragmentShader,
            depthWrite: false, depthTest: false
        });

        const quadGeometry = new THREE.PlaneGeometry(2, 2);
        scenePT.add(new THREE.Mesh(quadGeometry, ptMaterial));
        sceneDisplay.add(new THREE.Mesh(quadGeometry, displayMaterial));

        let needsReset = true;
        const requestReset = () => { needsReset = true; };

        function syncUniforms() {
            ptMaterial.uniforms.u_numLenses.value = lenses.length;
            for(let i=0; i<lenses.length; i++) {
                ptMaterial.uniforms.u_lensTypes.value[i] = lenses[i].type;
                ptMaterial.uniforms.u_lensPos.value[i].copy(lenses[i].pos);
                ptMaterial.uniforms.u_lensR.value[i] = lenses[i].r;
                ptMaterial.uniforms.u_lensAperture.value[i] = lenses[i].aperture;
                ptMaterial.uniforms.u_lensOffset.value[i] = lenses[i].type === 0
                    ? Math.sqrt(Math.max(lenses[i].r * lenses[i].r - lenses[i].aperture * lenses[i].aperture, 0.001))
                    : lenses[i].r + 0.2;
            }
            ptMaterial.uniforms.u_numScreens.value = screens.length;
            for(let i=0; i<screens.length; i++) {
                ptMaterial.uniforms.u_screenTypes.value[i] = screens[i].type;
                ptMaterial.uniforms.u_screenPos.value[i].copy(screens[i].pos);
                ptMaterial.uniforms.u_screenAperture.value[i] = screens[i].aperture || 0.3;
            }
            ptMaterial.uniforms.u_numLights.value = lights.length;
            for(let i=0; i<lights.length; i++) {
                ptMaterial.uniforms.u_lightTypes.value[i] = lights[i].type;
                ptMaterial.uniforms.u_lightPos.value[i].copy(lights[i].pos);
                ptMaterial.uniforms.u_lightColor.value[i].set(lights[i].color.r, lights[i].color.g, lights[i].color.b);
            }
            ptMaterial.uniforms.u_envLight.value = envLight;
            requestReset();
        }

        const gui = new GUI({ title: '⚙️ 光学器件控制台' });
        const hdrRow = document.createElement('div');
        hdrRow.id = 'hdr-row';
        hdrRow.appendChild(hdrButton);
        const guiChildren = gui.domElement.querySelector('.children') || gui.domElement;
        guiChildren.insertBefore(hdrRow, guiChildren.firstChild);
        let folders = [];
        
        function addObject(type) {
            if(type === 'convex' && lenses.length < MAX_LENSES) lenses.push({ type: 0, pos: new THREE.Vector3(0,0,0), r: 10.0, aperture: 4.0 });
            else if(type === 'concave' && lenses.length < MAX_LENSES) lenses.push({ type: 1, pos: new THREE.Vector3(0,0,0), r: 10.0, aperture: 4.0 });
            else if(type === 'screen' && screens.length < MAX_SCREENS) screens.push({ type: 0, pos: new THREE.Vector3(0,0,10), aperture: 0.3 });
            else if(type === 'pinhole' && screens.length < MAX_SCREENS) screens.push({ type: 1, pos: new THREE.Vector3(0,0,10), aperture: 0.3 });
            else if(type === 'flight' && lights.length < MAX_LIGHTS) lights.push({ type: 0, pos: new THREE.Vector3(0,0,-10), color: new THREE.Color(0xffffff) });
            else if(type === 'bulb' && lights.length < MAX_LIGHTS) lights.push({ type: 1, pos: new THREE.Vector3(0,0,-10), color: new THREE.Color(0xffddaa) });
            else { alert('该类型物体已达数量上限！'); return; }
            rebuildGUI(); syncUniforms();
        }

        function rebuildGUI() {
            folders.forEach(f => f.destroy());
            folders = [];
            
            lenses.forEach((item, i) => {
                const f = gui.addFolder((item.type===0?'🔍 凸透镜 ':'🔮 凹透镜 ') + (i+1));
                f.add(item.pos, 'z', -25, 25).name('Z轴位置(u/v)').onChange(syncUniforms);
                f.add(item, 'r', 2, 30).name('曲率半径(越小越强)').onChange(syncUniforms);
                f.add(item, 'aperture', 1, 8).name('光圈大小').onChange(syncUniforms);
                f.add({del: () => { lenses.splice(i, 1); rebuildGUI(); syncUniforms(); }}, 'del').name('❌ 删除');
                folders.push(f);
            });
            screens.forEach((item, i) => {
                const f = gui.addFolder((item.type===0?'⬜ 光屏 ':'🕳️ 小孔板 ') + (i+1));
                f.add(item.pos, 'z', -25, 25).name('Z轴位置').onChange(syncUniforms);
                if (item.type === 1) {
                    f.add(item, 'aperture', 0.1, 2.5).name('孔径大小(影响亮度)').onChange(syncUniforms);
                }
                f.add({del: () => { screens.splice(i, 1); rebuildGUI(); syncUniforms(); }}, 'del').name('❌ 删除');
                folders.push(f);
            });
            lights.forEach((item, i) => {
                const f = gui.addFolder((item.type===0?'🪧 F光源 ':'💡 灯泡 ') + (i+1));
                f.add(item.pos, 'z', -25, 25).name('Z轴位置').onChange(syncUniforms);
                f.add(item.pos, 'x', -10, 10).name('X轴平移').onChange(syncUniforms);
                f.addColor({col: item.color.getHex()}, 'col').name('颜色').onChange(v => { item.color.setHex(v); syncUniforms(); });
                f.add({del: () => { lights.splice(i, 1); rebuildGUI(); syncUniforms(); }}, 'del').name('❌ 删除');
                folders.push(f);
            });
        }

        const sceneParams = {
            addConvex: () => addObject('convex'), addConcave: () => addObject('concave'),
            addScreen: () => addObject('screen'), addPinhole: () => addObject('pinhole'),
            addFLight: () => addObject('flight'), addBulb: () => addObject('bulb'),
            envLight: envLight
        };
        gui.add(sceneParams, 'addFLight').name('➕ 添加 F光源');
        gui.add(sceneParams, 'addBulb').name('➕ 添加 灯泡');
        gui.add(sceneParams, 'addConvex').name('➕ 添加 凸透镜');
        gui.add(sceneParams, 'addConcave').name('➕ 添加 凹透镜');
        gui.add(sceneParams, 'addScreen').name('➕ 添加 光屏');
        gui.add(sceneParams, 'addPinhole').name('➕ 添加 小孔板');
        gui.add(sceneParams, 'envLight', 0, 0.5).name('环境光强度').onChange(v => { envLight = v; syncUniforms(); });
        
        rebuildGUI(); syncUniforms();

        // === 相机控制 (键鼠 + 触控) ===
        let isDragging = false;
        let lastMouseX = 0, lastMouseY = 0;
        
        window.addEventListener('mousedown', e => {
            if(e.target.tagName !== 'CANVAS') return;
            isDragging = true; lastMouseX = e.clientX; lastMouseY = e.clientY;
        });
        window.addEventListener('mouseup', () => isDragging = false);
        window.addEventListener('mousemove', e => {
            if(isDragging) {
                cameraYaw -= (e.clientX - lastMouseX) * 0.005;
                cameraPitch -= (e.clientY - lastMouseY) * 0.005;
                cameraPitch = Math.max(-Math.PI/2 + 0.1, Math.min(Math.PI/2 - 0.1, cameraPitch));
                cameraEuler.set(cameraPitch, cameraYaw, 0, 'YXZ');
                camera.quaternion.setFromEuler(cameraEuler);
                lastMouseX = e.clientX; lastMouseY = e.clientY;
                requestReset();
            }
        });

        window.addEventListener('wheel', e => {
            camera.fov += e.deltaY * 0.05;
            camera.fov = Math.max(10, Math.min(120, camera.fov));
            camera.updateProjectionMatrix();
            requestReset();
        });

        const keys = { w:false, a:false, s:false, d:false, q:false, e:false };
        window.addEventListener('keydown', e => { if(keys.hasOwnProperty(e.key.toLowerCase())) keys[e.key.toLowerCase()] = true; });
        window.addEventListener('keyup', e => { if(keys.hasOwnProperty(e.key.toLowerCase())) keys[e.key.toLowerCase()] = false; });

        let lastPinchDist = 0;
        const cameraEuler = new THREE.Euler(0, 0, 0, 'YXZ');
        window.addEventListener('touchstart', e => {
            if(e.target.tagName !== 'CANVAS') return;
            e.preventDefault();
            if(e.touches.length === 1) { isDragging = true; lastMouseX = e.touches[0].clientX; lastMouseY = e.touches[0].clientY; }
        }, {passive: false});
        window.addEventListener('touchend', e => { isDragging = false; if(e.touches.length < 2) lastPinchDist = 0; });
        window.addEventListener('touchmove', e => {
            e.preventDefault();
            if(e.touches.length === 1 && isDragging) {
                cameraYaw -= (e.touches[0].clientX - lastMouseX) * 0.005;
                cameraPitch -= (e.touches[0].clientY - lastMouseY) * 0.005;
                cameraPitch = Math.max(-Math.PI/2 + 0.1, Math.min(Math.PI/2 - 0.1, cameraPitch));
                cameraEuler.set(cameraPitch, cameraYaw, 0, 'YXZ');
                camera.quaternion.setFromEuler(cameraEuler);
                lastMouseX = e.touches[0].clientX; lastMouseY = e.touches[0].clientY;
                requestReset();
            } else if (e.touches.length === 2) {
                const dist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
                if(lastPinchDist > 0) {
                    camera.fov += (lastPinchDist - dist) * 0.1;
                    camera.fov = Math.max(10, Math.min(120, camera.fov));
                    camera.updateProjectionMatrix();
                    requestReset();
                }
                lastPinchDist = dist; isDragging = false;
            }
        }, {passive: false});

        let joyMove = { x: 0, y: 0 };
        if ('ontouchstart' in window) {
            document.getElementById('joystick-zone').style.display = 'block';
            try {
                const manager = nipplejs.create({ zone: document.getElementById('joystick-zone'), mode: 'static', position: { left: '75px', bottom: '75px' }, color: 'white' });
                manager.on('move', (e, data) => { joyMove.x = Math.cos(data.angle.radian) * data.distance * 0.02; joyMove.y = Math.sin(data.angle.radian) * data.distance * 0.02; });
                manager.on('end', () => { joyMove.x = 0; joyMove.y = 0; });
            } catch(e) { console.warn('摇杆加载失败'); }
        }

        const forward = new THREE.Vector3();
        const right = new THREE.Vector3();
        const up = new THREE.Vector3(0, 1, 0);
        const moveDirection = new THREE.Vector3();

        function updateCameraTransform(deltaSeconds) {
            let moved = false;
            const speed = 18.0;
            forward.set(0, 0, -1).applyEuler(camera.rotation).normalize();
            right.set(1, 0, 0).applyEuler(camera.rotation).normalize();

            moveDirection.set(0, 0, 0);
            if(keys.w) moveDirection.add(forward); if(keys.s) moveDirection.sub(forward);
            if(keys.a) moveDirection.sub(right); if(keys.d) moveDirection.add(right);
            if(keys.e) moveDirection.add(up); if(keys.q) moveDirection.sub(up);

            if(joyMove.x !== 0 || joyMove.y !== 0) {
                moveDirection.addScaledVector(forward, joyMove.y);
                moveDirection.addScaledVector(right, joyMove.x);
            }

            if(moveDirection.lengthSq() > 0.01) {
                camera.position.add(moveDirection.normalize().multiplyScalar(speed * deltaSeconds));
                moved = true;
            }
            if(moved) requestReset();
            
            camera.updateMatrixWorld();
            ptMaterial.uniforms.u_cameraWorldMatrix.value.copy(camera.matrixWorld);
            ptMaterial.uniforms.u_cameraProjectionMatrixInverse.value.copy(camera.projectionMatrixInverse);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderWidth = Math.max(1, window.innerWidth);
            renderHeight = Math.max(1, window.innerHeight);
            rtA.setSize(renderWidth, renderHeight);
            rtB.setSize(renderWidth, renderHeight);
            ptMaterial.uniforms.u_resolution.value.set(renderWidth, renderHeight);
            displayMaterial.uniforms.u_textureResolution.value.set(renderWidth, renderHeight);
            resizeHdrPresentation();
            resetAccumulation();
        });

        const sampleCountSpan = document.getElementById('sample-count');
        const loadingDiv = document.getElementById('loading');
        let lastUiUpdate = 0;

        function resetAccumulation() {
            needsReset = true;
            ptMaterial.uniforms.u_sampleCount.value = 1.0;
            sampleCountSpan.innerText = '0';
            lastUiUpdate = performance.now();

            // resize 后立即清空两个 ping-pong 缓冲，避免旧图像残留。
            renderer.setRenderTarget(rtA);
            renderer.clearColor();
            renderer.setRenderTarget(rtB);
            renderer.clearColor();
            renderer.setRenderTarget(null);
        }

        // 用 GPU fence + MessageChannel 解耦 PT 计算和屏幕刷新。
        // 浏览器仍可能按显示器刷新合成画面，但 GPU pass 不再由 requestAnimationFrame 限速。
        const renderContext = renderer.getContext();
        const gpuFences = [];
        const renderChannel = new MessageChannel();
        const maxInFlight = 2;
        // 从 4 pass 起步；根据实际采样速率动态调整，避免核显一次卡住太久。
        let passesPerBatch = 4;
        const minPassesPerBatch = 1;
        const maxPassesPerBatch = 8;
        const batchRateWindowMs = 750;
        const batchRateLow = 120.0;
        const batchRateHigh = 450.0;
        let batchRateWindowStart = performance.now();
        let batchRateSampleStart = ptMaterial.uniforms.u_sampleCount.value;
        let batchRateEma = 0;
        const hasGpuFence = typeof renderContext.fenceSync === 'function';
        let renderRunning = true;
        let lastRenderTime = performance.now();

        function adaptBatchSize(now) {
            const currentSample = hdrPresentation
                ? hdrPresentation.sampleCount
                : ptMaterial.uniforms.u_sampleCount.value;
            if (currentSample < batchRateSampleStart) {
                batchRateSampleStart = currentSample;
                batchRateWindowStart = now;
                return;
            }

            const elapsed = now - batchRateWindowStart;
            if (elapsed < batchRateWindowMs) return;

            const sampleRate = (currentSample - batchRateSampleStart) * 1000.0 / elapsed;
            batchRateEma = batchRateEma === 0 ? sampleRate : batchRateEma * 0.7 + sampleRate * 0.3;
            batchRateSampleStart = currentSample;
            batchRateWindowStart = now;

            // 用 2 倍/二分并带滞回，避免批次大小在边界附近来回抖动。
            if (batchRateEma < batchRateLow && passesPerBatch > minPassesPerBatch) {
                passesPerBatch = Math.max(minPassesPerBatch, Math.floor(passesPerBatch * 0.5));
            } else if (batchRateEma > batchRateHigh && passesPerBatch < maxPassesPerBatch) {
                passesPerBatch = Math.min(maxPassesPerBatch, passesPerBatch * 2);
            }
        }

        function renderPass() {
            const now = performance.now();
            const deltaSeconds = Math.min((now - lastRenderTime) * 0.001, 0.1);
            lastRenderTime = now;

            if (hdrPresentation) {
                renderHdrPass(deltaSeconds);
                return;
            }

            updateCameraTransform(deltaSeconds);
            for (let pass = 0; pass < passesPerBatch; pass++) {
                ptMaterial.uniforms.u_frame.value++;

                if (needsReset) {
                    ptMaterial.uniforms.u_sampleCount.value = 1.0;
                    needsReset = false;
                } else {
                    ptMaterial.uniforms.u_sampleCount.value += 1.0;
                }

                ptMaterial.uniforms.tPrevious.value = rtA.texture;
                renderer.setRenderTarget(rtB);
                renderer.render(scenePT, cameraPT);

                let temp = rtA; rtA = rtB; rtB = temp;
            }

            displayMaterial.uniforms.tTexture.value = rtA.texture;
            renderer.setRenderTarget(null);
            renderer.render(sceneDisplay, cameraPT);

            // DOM 更新不参与每个 PT pass，避免解锁后让文本布局成为新瓶颈。
            if (now - lastUiUpdate >= 100) {
                sampleCountSpan.innerText = Math.floor(ptMaterial.uniforms.u_sampleCount.value);
                lastUiUpdate = now;
            }
            if (loadingDiv.style.display !== 'none') loadingDiv.style.display = 'none';
        }

        function renderLoop() {
            if (!renderRunning) return;

            if (hasGpuFence) {
                while (gpuFences.length > 0) {
                    const fence = gpuFences[0];
                    const result = renderContext.clientWaitSync(fence.sync, 0, 0);
                    if (result === renderContext.TIMEOUT_EXPIRED || result === renderContext.WAIT_FAILED) break;
                    gpuFences.shift();
                    renderContext.deleteSync(fence.sync);
                }

                if (gpuFences.length >= maxInFlight) {
                    setTimeout(renderLoop, 1);
                    return;
                }
            }

            adaptBatchSize(performance.now());

            renderPass();

            if (hasGpuFence) {
                gpuFences.push({
                    sync: renderContext.fenceSync(renderContext.SYNC_GPU_COMMANDS_COMPLETE, 0),
                    submittedAt: performance.now()
                });
                renderContext.flush();
            }

            renderChannel.port1.postMessage(null);
        }

        camera.updateMatrixWorld();
        renderChannel.port2.onmessage = renderLoop;
        renderChannel.port1.postMessage(null);
    </script>
</body>
</html>
